<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Ambrosía</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

  <header class="header-ambrosia py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="marca-ambrosia text-decoration-none">Ambrosía</a>
      <nav class="nav-ambrosia d-none d-lg-flex">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link" href="catalogo.html">Catálogo</a>
      </nav>
      <a href="registro.html" class="btn-ambrosia-outline btn-sm">Crear cuenta</a>
    </div>
  </header>

  <section class="seccion-auth seccion-auth--cliente">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

          <div class="text-center mb-4">
            <div class="icono-auth icono-auth--rosa"><i class="bi bi-cup-hot"></i></div>
            <span class="eyebrow">Bienvenido de nuevo</span>
            <h1 class="fuente-display mt-1">Inicia sesión</h1>
          </div>

          <div id="aviso-carrito" class="mensaje-formulario mensaje-formulario--exito" style="display:none;">
            Inicia sesión para continuar con tu compra.
          </div>

          <form id="form-login" class="formulario-ambrosia" novalidate>
            <div id="mensaje-error" class="mensaje-formulario mensaje-formulario--error"></div>

            <div class="mb-3">
              <label for="correo">Correo electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="correo" required autocomplete="email">
              </div>
            </div>

            <div class="mb-4">
              <label for="contrasena">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="contrasena" required autocomplete="current-password">
              </div>
              <div class="text-end mt-1">
                <a href="recuperar.html" class="small">¿Olvidaste tu contraseña?</a>
              </div>
            </div>

            <button type="submit" class="btn-ambrosia w-100" id="boton-login">Iniciar sesión</button>

            <p class="text-center small mt-4 mb-0">
              ¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
          </form>

        </div>
      </div>
    </div>
  </section>

  <footer class="footer-ambrosia py-4">
    <div class="container text-center">
      <p class="small mb-0" style="opacity: 0.6;">&copy; 2026 Ambrosía. Sistema Bellatrix.</p>
    </div>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Empleados — Ambrosía</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

  <header class="header-ambrosia py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="marca-ambrosia text-decoration-none">Ambrosía</a>
      <span class="eyebrow m-0 text-muted d-none d-sm-inline">Panel Administrativo</span>
      <a href="login.html" class="btn-ambrosia-outline btn-sm">Acceso Clientes</a>
    </div>
  </header>

  <section class="seccion-auth seccion-auth--empleado">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

          <div class="text-center mb-4">
            <div class="icono-auth icono-auth--menta"><i class="bi bi-shield-lock"></i></div>
            <span class="eyebrow" style="color: var(--menta-fuerte);">Portal Interno</span>
            <h1 class="fuente-display mt-1">Acceso de Empleados</h1>
          </div>

          <form id="form-login-empleado" class="formulario-ambrosia" novalidate>
            <div id="mensaje-error" class="mensaje-formulario mensaje-formulario--error" style="display:none;"></div>

            <div class="mb-3">
              <label for="usuario">Usuario de red/sistema</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                <input type="text" class="form-control" id="usuario" required placeholder="ej: angel.admin" autocomplete="username">
              </div>
            </div>

            <div class="mb-4">
              <label for="contrasena">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="contrasena" required placeholder="••••••••" autocomplete="current-password">
              </div>
            </div>

            <button type="submit" class="btn-ambrosia-sage w-100" id="boton-login">
              Ingresar al Panel
            </button>
          </form>

        </div>
      </div>
    </div>
  </section>

  <footer class="footer-ambrosia py-4">
    <div class="container text-center">
      <p class="small mb-0" style="opacity: 0.6;">&copy; 2026 Ambrosía. Sistema Bellatrix.</p>
    </div>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/login_empleado.js"></script>
</body>
</html>

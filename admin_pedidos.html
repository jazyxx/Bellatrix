<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeja de Pedidos — Ambrosía</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <!-- Contenido principal -->
  <div class="row">
    <div class="col-12 mb-4 d-flex align-items-center justify-content-between flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">
        <span class="db-card-icono db-card-icono--primary"><i class="bi bi-truck"></i></span>
        <div>
          <h1 class="fuente-display mb-0" style="font-size: 1.6rem;">Bandeja de Pedidos en Línea</h1>
          <p class="text-muted mb-0">Gestiona el ciclo de preparación y despacho de pedidos confirmados del E-Commerce.</p>
        </div>
      </div>
      <div>
        <!-- Selector de estados para filtrado de bandeja de trabajo -->
        <select class="form-select form-db form-select-sm" id="pedidos-estado-filtro" onchange="cargarPedidosBandeja()">
          <option value="Confirmado">Confirmados (Por preparar)</option>
          <option value="En preparación">En preparación</option>
          <option value="Listo para recoger">Listos para Recoger / Despachar</option>
          <option value="Entregado">Entregados</option>
          <option value="Pendiente de pago">Pendientes de Pago</option>
          <option value="Cancelado">Cancelados</option>
        </select>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="db-card">
        <div class="d-flex align-items-center gap-2 mb-3">
          <span class="db-card-icono db-card-icono--success"><i class="bi bi-list-check"></i></span>
          <h3 class="h5 mb-0 fuente-display" id="bandeja-titulo">Cola de Órdenes</h3>
        </div>
        <hr class="my-2">
        <div class="table-responsive">
          <table class="db-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Fecha Creación</th>
                <th>Cliente / Celular</th>
                <th>Dirección de Entrega</th>
                <th>Detalle Productos</th>
                <th>Total</th>
                <th class="text-end">Acciones de Gestión</th>
              </tr>
            </thead>
            <tbody id="tabla-bandeja-pedidos">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">No hay pedidos pendientes de gestión en este estado.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard_components.js"></script>
  <script src="assets/js/admin_pedidos.js"></script>
</body>
</html>

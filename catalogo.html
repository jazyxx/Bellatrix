<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — Ambrosía</title>
  <meta name="description" content="Explora tortas, postres y helados de Ambrosía por categoría o búsqueda.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

  <header class="header-ambrosia py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="marca-ambrosia text-decoration-none">Ambrosía</a>
      <nav class="nav-ambrosia d-none d-lg-flex">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link activo" href="catalogo.html">Catálogo</a>
        <a class="nav-link" href="catalogo.html?unidad=Pastelería">Pastelería</a>
        <a class="nav-link" href="catalogo.html?unidad=Heladería">Heladería</a>
        <a class="nav-link" href="index.html#onces">Salón de Onces</a>
      </nav>
      <div class="d-flex align-items-center">
        <a href="carrito.html" class="icono-accion me-3 text-decoration-none" aria-label="Ver carrito">
          <i class="bi bi-basket3-fill"></i>
          <span id="contador-carrito" class="contador-carrito" style="display:none;">0</span>
        </a>
        <div id="zona-cuenta" class="d-flex align-items-center"></div>
      </div>
    </div>
  </header>

  <section class="seccion-catalogo-hero reveal">
    <div class="container">
      <span class="eyebrow">Todo lo que horneamos</span>
      <h1 class="fuente-display mt-1 mb-0">Catálogo</h1>
    </div>
  </section>

  <section class="py-4" style="background-color: var(--crema);">
    <div class="container">

     <!-- ============================================================
           BARRA DE FILTROS
           ============================================================ -->
      <div class="barra-filtros barra-filtros--sticky d-flex flex-wrap align-items-center gap-3 mb-4">
        <div class="d-flex gap-2 flex-wrap" id="chips-unidad">
          <button class="chip-filtro activo" data-unidad="">Todo</button>
          <button class="chip-filtro" data-unidad="Pastelería">Pastelería</button>
          <button class="chip-filtro" data-unidad="Heladería">Heladería</button>
          
          <!-- Botón de Torta Personalizada que abre el modal -->
          <button type="button" class="chip-filtro fw-bold" style="background-color: #e4f7e4; color: #413724; border-color: #b4e2c5;" data-bs-toggle="modal" data-bs-target="#modalTortaPersonalizada">
            <i class="bi bi-cake2-fill me-1"></i> Torta Personalizada
          </button>
        </div>

        <form id="form-busqueda" class="ms-md-auto d-flex" style="min-width: 260px;" role="search">
          <input
            type="search"
            id="campo-busqueda"
            class="form-control"
            placeholder="Buscar un producto…"
            aria-label="Buscar producto"
            style="border-radius: 999px 0 0 999px; border-color: var(--borde-suave); border-right: none;"
          >
          <button type="submit" class="btn-ambrosia" style="border-radius: 0 999px 999px 0;">Buscar</button>
        </form>
      </div>

      <!-- ============================================================
           GRILLA DE PRODUCTOS
           ============================================================ -->
      <div id="grilla-catalogo" class="row g-4 pb-5">
        <div class="col-12 text-center text-muted py-5" id="catalogo-cargando">Cargando catálogo…</div>
      </div>

    </div>
  </section>

<!-- ============================================================
       MODAL TORTA PERSONALIZADA
       ============================================================ -->
  <div class="modal fade" id="modalTortaPersonalizada" tabindex="-1" aria-labelledby="modalTortaLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
      <div class="modal-content" style="border-radius: 1rem; border: none;">
        <div class="modal-header" style="background-color: var(--crema); border-bottom: 2px solid var(--borde-suave); border-radius: 1rem 1rem 0 0;">
          <h5 class="modal-title fuente-display fw-bold" id="modalTortaLabel" style="color: var(--texto-oscuro);">
            <i class="bi bi-cake2 me-2" style="color: #b48855;"></i>Cotizar Torta Personalizada
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body p-4">
          <form id="form-torta-personalizada">
            
            <!-- Fecha de entrega -->
            <div class="mb-4">
              <label for="torta-fecha" class="form-label fw-bold">Día de Entrega <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="torta-fecha" required style="border-radius: 0.5rem;">
            </div>

            <div class="row g-4 mb-4">
              <!-- Tamaño / Pisos -->
              <div class="col-md-5">
                <label class="form-label fw-bold">Tamaño</label>
                <div class="d-flex flex-column gap-2">
                  <div class="form-check"><input class="form-check-input chk-piso" type="checkbox" value="Primera" id="p1"><label class="form-check-label" for="p1">Primera</label></div>
                  <div class="form-check"><input class="form-check-input chk-piso" type="checkbox" value="Segunda" id="p2"><label class="form-check-label" for="p2">Segunda</label></div>
                  <div class="form-check"><input class="form-check-input chk-piso" type="checkbox" value="Tercera" id="p3"><label class="form-check-label" for="p3">Tercera</label></div>
                  <div class="form-check"><input class="form-check-input chk-piso" type="checkbox" value="Cuarta" id="p4"><label class="form-check-label" for="p4">Cuarta</label></div>
                  <div class="form-check"><input class="form-check-input chk-piso" type="checkbox" value="Quinta" id="p5"><label class="form-check-label" for="p5">Quinta</label></div>
                  <div class="form-check"><input class="form-check-input chk-piso" type="checkbox" value="Sexta" id="p6"><label class="form-check-label" for="p6">Sexta</label></div>
                </div>
              </div>

              <!-- Sabores / Masas -->
              <div class="col-md-7">
                <label class="form-label fw-bold">Tipo de Masa / Sabor</label>
                <div class="row g-2">
                  <div class="col-sm-6"><div class="form-check"><input class="form-check-input chk-masa" type="checkbox" value="Masa Blanca" id="m1"><label class="form-check-label" for="m1">Masa Blanca</label></div></div>
                  <div class="col-sm-6"><div class="form-check"><input class="form-check-input chk-masa" type="checkbox" value="Masa Negra" id="m2"><label class="form-check-label" for="m2">Masa Negra</label></div></div>
                  <div class="col-sm-6"><div class="form-check"><input class="form-check-input chk-masa" type="checkbox" value="3 Leches" id="m3"><label class="form-check-label" for="m3">3 Leches</label></div></div>
                  <div class="col-sm-6"><div class="form-check"><input class="form-check-input chk-masa" type="checkbox" value="Milky Way" id="m4"><label class="form-check-label" for="m4">Milky Way</label></div></div>
                  <div class="col-sm-6"><div class="form-check"><input class="form-check-input chk-masa" type="checkbox" value="Torta de Helado" id="m5"><label class="form-check-label" for="m5">Torta de Helado</label></div></div>
                  <div class="col-sm-6"><div class="form-check"><input class="form-check-input chk-masa" type="checkbox" value="Torta Chocolate" id="m6"><label class="form-check-label" for="m6">Torta Chocolate</label></div></div>
                  <div class="col-sm-6"><div class="form-check"><input class="form-check-input chk-masa" type="checkbox" value="Torta Española" id="m7"><label class="form-check-label" for="m7">Torta Española</label></div></div>
                  <div class="col-sm-6"><div class="form-check"><input class="form-check-input chk-masa" type="checkbox" value="Torta María Luisa" id="m8"><label class="form-check-label" for="m8">Torta María Luisa</label></div></div>
                  <div class="col-sm-6"><div class="form-check"><input class="form-check-input chk-masa" type="checkbox" value="Torta de Amapola" id="m9"><label class="form-check-label" for="m9">Torta de Amapola</label></div></div>
                </div>
              </div>
            </div>

            <!-- Forma de la Torta -->
            <div class="mb-4">
              <label class="form-label fw-bold">Forma de la Torta</label>
              <div class="d-flex flex-wrap gap-4">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="tortaForma" id="f-redonda" value="Redonda" checked>
                  <label class="form-check-label" for="f-redonda">Redonda</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="tortaForma" id="f-cuadrada" value="Cuadrada">
                  <label class="form-check-label" for="f-cuadrada">Cuadrada</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="tortaForma" id="f-corazon" value="Corazón">
                  <label class="form-check-label" for="f-corazon">Corazón</label>
                </div>
              </div>
            </div>

            <!-- Especificaciones -->
            <div class="mb-2">
              <label for="torta-especificaciones" class="form-label fw-bold">Especificaciones del Diseño</label>
              <textarea class="form-control" id="torta-especificaciones" rows="3" placeholder="Ej: Que tenga temática de F1, colores rojo y negro, y diga 'Feliz Cumpleaños'..." style="border-radius: 0.5rem;"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer d-flex justify-content-between align-items-center" style="background-color: #f8f9fa; border-radius: 0 0 1rem 1rem;">
          <small class="text-muted d-none d-sm-block">Te contactaremos para detalles y pago.</small>
          <button type="button" class="btn btn-success px-4" id="btn-enviar-whatsapp" style="border-radius: 999px;">
            <i class="bi bi-whatsapp me-2"></i>Enviar a WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-ambrosia">
    <div class="container text-center">
      <span class="marca-ambrosia" style="color: var(--crema);">Ambrosía</span>
      <p class="small mt-2 mb-0" style="opacity: 0.6;">&copy; 2026 Ambrosía. Sistema Bellatrix.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/componentes.js"></script>
  <script src="assets/js/catalogo.js"></script>
  <script>
    // Solo visual: revela el encabezado al cargar (no toca lógica de negocio).
    (function () {
      var elementos = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window) || elementos.length === 0) {
        elementos.forEach(function (el) { el.classList.add('reveal--visible'); });
        return;
      }
      var observador = new IntersectionObserver(function (entradas) {
        entradas.forEach(function (entrada) {
          if (entrada.isIntersecting) {
            entrada.target.classList.add('reveal--visible');
            observador.unobserve(entrada.target);
          }
        });
      }, { threshold: 0.15 });
      elementos.forEach(function (el) { observador.observe(el); });
    })();
  </script>
</body>
</html>

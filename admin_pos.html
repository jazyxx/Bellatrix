<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de Venta POS — Ambrosía</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <style>
    /* Estilos específicos para un POS fluido */
    .pos-categories {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }
    .pos-category-btn {
      background-color: var(--db-white);
      border: 1.5px solid var(--db-border);
      border-radius: 999px;
      padding: 0.4rem 1.2rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--db-espresso);
      white-space: nowrap;
      transition: transform 0.16s var(--db-ease-out), background-color 0.16s var(--db-ease-out), border-color 0.16s var(--db-ease-out), color 0.16s var(--db-ease-out);
      cursor: pointer;
    }
    .pos-category-btn:hover:not(.active) { border-color: var(--db-primary-dark); transform: translateY(-1px); }
    .pos-category-btn.active {
      background: linear-gradient(155deg, var(--db-primary) 0%, var(--db-primary-dark) 100%);
      border-color: var(--db-primary-dark);
      color: var(--db-espresso);
      box-shadow: 0 6px 14px -8px rgba(124,168,232,0.55);
    }
    .pos-item-card {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .pos-item-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      font-family: var(--fuente-cuerpo);
    }
    .pos-item-price {
      font-weight: 800;
      color: var(--db-espresso-suave);
      font-size: 0.9rem;
    }
    .pos-cart-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 100px);
    }
    .pos-search-icono {
      background: var(--db-white);
      border: 1.5px solid var(--db-border);
      border-right: none;
      color: var(--db-espresso-suave);
    }
    #pos-buscar-input:focus ~ .pos-search-icono,
    .input-group:focus-within .pos-search-icono { border-color: var(--db-primary-dark); }
    .cart-summary { border-radius: var(--db-radius-sm); }
    .pos-icono-vacio {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 0.75rem;
      background: rgba(163, 196, 243, 0.2);
      font-size: 1.4rem; color: var(--db-primary-dark);
    }
  </style>
</head>
<body>

  <!-- Contenido principal que inyecta injectDashboardLayout -->
  <div class="row">
    <!-- Catálogo de productos -->
    <div class="col-lg-7">
      <div class="db-card p-3">
        <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <span class="db-card-icono db-card-icono--primary"><i class="bi bi-shop"></i></span>
            <h2 class="h4 mb-0 fuente-display">Punto de Venta</h2>
          </div>
          <div class="d-flex align-items-center gap-2">
            <!-- Selector de Unidad de Negocio para Venta -->
            <select class="form-select form-db form-select-sm" id="pos-unidad-vender" style="width: 150px;">
              <option value="Pastelería">Pastelería</option>
              <option value="Heladería">Heladería</option>
            </select>
          </div>
        </div>

        <div class="input-group mb-3">
          <span class="input-group-text pos-search-icono"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control form-db border-start-0" id="pos-buscar-input" placeholder="Buscar por nombre de producto..." style="padding-left: 0.25rem;">
        </div>

        <!-- Categorías de Filtrado rápido -->
        <div class="pos-categories" id="pos-categories-container">
          <div class="pos-category-btn active" data-categoria="todos">Todos</div>
          <div class="pos-category-btn" data-categoria="Tortas">Tortas</div>
          <div class="pos-category-btn" data-categoria="Postres">Postres</div>
          <div class="pos-category-btn" data-categoria="Helados">Helados</div>
          <div class="pos-category-btn" data-categoria="Bebidas">Bebidas</div>
        </div>

        <!-- Grilla de productos interactiva -->
        <div class="row g-2" id="pos-product-grid" style="max-height: calc(100vh - 320px); overflow-y: auto; padding: 4px;">
          <div class="col-12 text-center text-muted py-5">Cargando productos del POS…</div>
        </div>
      </div>
    </div>

    <!-- Carrito Lateral y Cálculo de totales -->
    <div class="col-lg-5">
      <div class="pos-cart pos-cart-container p-3">
        <h3 class="h5 mb-3 fuente-display border-bottom pb-2 d-flex align-items-center justify-content-between">
          <span class="d-flex align-items-center gap-2"><i class="bi bi-basket3-fill" style="color: var(--db-primary-dark);"></i>Carrito de Venta</span>
          <span class="badge bg-secondary rounded-pill" id="cart-count-badge" style="font-size: 0.75rem;">0 items</span>
        </h3>

        <!-- Lista de items agregados -->
        <div class="cart-items" id="pos-cart-items">
          <div class="text-center text-muted my-5 py-4">
            <div class="pos-icono-vacio"><i class="bi bi-basket3"></i></div>
            El carrito está vacío.<br>Haz clic en los productos para agregarlos.
          </div>
        </div>

        <!-- Resumen de Totales -->
        <div class="cart-summary rounded p-3 mb-3">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="small text-muted">Subtotal:</span>
            <span class="fw-bold" id="cart-subtotal">$ 0</span>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-2">
            <span class="small text-muted">Impuestos (IVA 19% incl.):</span>
            <span class="fw-bold" id="cart-tax">$ 0</span>
          </div>
          <hr class="my-2 dashed">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <span class="fw-bold" style="font-size: 1.1rem;">TOTAL A PAGAR:</span>
            <span class="fw-extrabold text-success" id="cart-total" style="font-size: 1.4rem;">$ 0</span>
          </div>

          <!-- Cálculo de Cambio -->
          <div class="row g-2 align-items-center mb-3">
            <div class="col-sm-6">
              <label class="small text-muted d-block mb-1">Recibido:</label>
              <input type="number" class="form-control form-db" id="pos-recibido" placeholder="ej: 50000" min="0">
            </div>
            <div class="col-sm-6 text-end">
              <span class="small text-muted d-block mb-1">Cambio:</span>
              <strong class="text-dark" id="pos-cambio" style="font-size: 1.1rem;">$ 0</strong>
            </div>
          </div>

          <button class="btn btn-db-success w-100 py-3 font-weight-bold" id="pos-btn-finalizar" disabled>
            <i class="bi bi-cash-coin me-1"></i>Registrar y Finalizar Venta
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard_components.js"></script>
  <script src="assets/js/admin_pos.js"></script>
</body>
</html>

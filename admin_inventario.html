<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos y Vitrina — Ambrosía</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <!-- Contenido principal -->
  <div class="row">
    <div class="col-12 mb-4 d-flex align-items-center justify-content-between flex-wrap gap-2">
      <div class="d-flex align-items-center gap-2">
        <span class="db-card-icono db-card-icono--success"><i class="bi bi-cup-hot-fill"></i></span>
        <div>
          <h1 class="fuente-display mb-0" style="font-size: 1.6rem;">Productos en Vitrina</h1>
          <p class="text-muted mb-0">Controla el catálogo de productos terminados y su stock para la venta.</p>
        </div>
      </div>
      <div>
        <button class="btn btn-db-primary btn-sm" onclick="abrirModalProducto()"><i class="bi bi-plus-lg me-1"></i>Nuevo Producto</button>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- Tabla de Productos Terminados (Ahora ocupa el 100% del ancho) -->
    <div class="col-12">
      <div class="db-card">
        <div class="input-group mb-3">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control form-db border-start-0" id="prod-buscar" placeholder="Filtrar vitrina por nombre..." oninput="filtrarProductosVitrina()">
        </div>

        <div class="table-responsive text-nowrap" style="max-height: 600px; overflow-y: auto;">
          <table class="db-table">
            <thead>
              <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Unidad</th>
                <th class="text-center">Stock</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-productos-inventario">
              <!-- Cargado dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: Crear/Editar Producto -->
  <div class="modal fade" id="modal-producto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow-lg" style="border-radius: var(--db-radius);">
        <div class="modal-header bg-light border-0">
          <h5 class="modal-title fuente-display" id="modal-producto-titulo">Crear Nuevo Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="form-modal-producto">
          <input type="hidden" id="prod-id">
          <div class="modal-body">
            <div class="mb-3">
              <label for="prod-nombre" class="small text-muted d-block mb-1">Nombre del producto:</label>
              <input type="text" class="form-control form-db" id="prod-nombre" required placeholder="ej: Torta Selva Negra">
            </div>
            <div class="mb-3">
              <label for="prod-descripcion" class="small text-muted d-block mb-1">Descripción corta:</label>
              <textarea class="form-control form-db" id="prod-descripcion" rows="2" placeholder="ej: Bizcochuelo de chocolate relleno con crema..."></textarea>
            </div>
            <div class="row mb-3">
              <div class="col-6">
                <label for="prod-unidad" class="small text-muted d-block mb-1">Unidad de Negocio:</label>
                <select class="form-select form-db" id="prod-unidad" required>
                  <option value="Pastelería">Pastelería</option>
                  <option value="Heladería">Heladería</option>
                </select>
              </div>
              <div class="col-6">
                <label for="prod-tipo" class="small text-muted d-block mb-1">Categoría:</label>
                <select class="form-select form-db" id="prod-tipo" required>
                  <option value="Tortas">Tortas</option>
                  <option value="Postres">Postres</option>
                  <option value="Helados">Helados</option>
                  <option value="Bebidas">Bebidas</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-6">
                <label for="prod-precio" class="small text-muted d-block mb-1">Precio de Venta (COP):</label>
                <input type="number" class="form-control form-db" id="prod-precio" required min="1" placeholder="ej: 35000">
              </div>
              <div class="col-6" id="prod-stock-container">
                <label for="prod-stock" class="small text-muted d-block mb-1">Stock Inicial:</label>
                <input type="number" class="form-control form-db" id="prod-stock" value="0" min="0">
              </div>
            </div>
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-db-outline btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-db-success btn-sm" id="prod-btn-guardar">Guardar Producto</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard_components.js"></script>
  <script src="assets/js/admin_inventario.js"></script>
</body>
</html>

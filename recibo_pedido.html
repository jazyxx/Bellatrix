<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recibo de Pedido - Ambrosía</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito Sans', sans-serif; background: #f8f9fa; padding: 20px; }
    .receipt-container { background: #fff; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .brand-header { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed #dee2e6; padding-bottom: 20px; }
    .brand-title { font-family: 'Fraunces', serif; color: #d63384; font-weight: 700; }
    
    /* Esta regla es magia pura: oculta botones e imperfecciones al momento de imprimir o guardar como PDF */
    @media print {
      body { background: #fff; padding: 0; }
      .receipt-container { box-shadow: none; max-width: 100%; padding: 0; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="receipt-container" id="recibo-contenido">
    <div class="text-center my-5 text-muted">Generando recibo...</div>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Obtener el ID de la URL
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      
      if (!id) {
        document.getElementById('recibo-contenido').innerHTML = '<div class="alert alert-danger">Error: No se especificó el número de pedido.</div>';
        return;
      }

      // 2. Traer los datos usando la misma ruta de la API que usas en el dashboard
      const respuesta = await apiFetch(`api/pedidos/${id}`);
      if (!respuesta.exito || !respuesta.datos) {
        document.getElementById('recibo-contenido').innerHTML = '<div class="alert alert-danger">Error al cargar la información del pedido.</div>';
        return;
      }

      const p = respuesta.datos;
      
      // Formatear la fecha
      const fechaObj = new Date(p.fecha_creacion);
      const fechaFormateada = fechaObj.toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' });

      // 3. Armar la lista de productos
      let itemsHtml = '';
      if (p.productos && p.productos.length > 0) {
        p.productos.forEach(item => {
          // Usamos toLocaleString para formatear el dinero al estilo colombiano
          itemsHtml += `
            <tr>
              <td>${item.cantidad}x</td>
              <td>${item.nombre || 'Producto'}</td>
              <td class="text-end">$${Number(item.subtotal).toLocaleString('es-CO')}</td>
            </tr>
          `;
        });
      }

      // 4. Inyectar el HTML final del recibo
      const html = `
        <div class="no-print mb-3 text-end">
          <button onclick="window.print()" class="btn btn-secondary btn-sm">Imprimir / Guardar como PDF</button>
        </div>
        <div class="brand-header">
          <h2 class="brand-title h3 mb-0">Pastelería Ambrosía</h2>
          <p class="text-muted small mb-0">Recibo de Compra Virtual</p>
        </div>
        
        <div class="mb-4">
          <p class="mb-1"><strong>Pedido #:</strong> ${p.id_pedido}</p>
          <p class="mb-1"><strong>Fecha:</strong> ${fechaFormateada}</p>
          <p class="mb-1"><strong>Estado:</strong> ${p.estado}</p>
          <p class="mb-1"><strong>Entrega a:</strong> ${p.direccion_entrega || 'Recoge en Tienda física'}</p>
        </div>
        
        <table class="table table-sm table-borderless border-top border-bottom mb-4">
          <thead>
            <tr class="border-bottom">
              <th>Cant.</th>
              <th>Descripción</th>
              <th class="text-end">Subtotal</th>
            </tr>
          </thead>
          <tbody>
            ${itemsHtml}
          </tbody>
          <tfoot>
            <tr class="border-top">
              <th colspan="2" class="text-end pt-3">TOTAL PAGADO:</th>
              <th class="text-end pt-3 h5 mb-0 text-success">$${Number(p.total).toLocaleString('es-CO')}</th>
            </tr>
          </tfoot>
        </table>
        
        <div class="text-center mt-4 text-muted small">
          <p>¡Gracias por tu compra!<br>Conserva este recibo digital para cualquier duda o reclamo.</p>
        </div>
      `;
      
      document.getElementById('recibo-contenido').innerHTML = html;
    });
  </script>
</body>
</html>

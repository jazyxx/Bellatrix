<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones — Ambrosía</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <div class="db-welcome-banner">
    <div class="db-welcome-banner__icono"><i class="bi bi-bell-fill"></i></div>
    <div>
      <h1 class="fuente-display">Notificaciones</h1>
      <p>Aquí verás las novedades sobre tus pedidos y tu cuenta en Ambrosía.</p>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="db-card db-card--warning">
        <div class="d-flex align-items-center gap-2 mb-3">
          <span class="db-card-icono db-card-icono--warning"><i class="bi bi-bell-fill"></i></span>
          <h3 class="h5 mb-0 fuente-display">Notificaciones Recientes</h3>
        </div>
        <hr class="my-2">
        <div id="lista-notificaciones">
          <p class="text-muted small text-center my-4">Cargando notificaciones…</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard_components.js"></script>
  <script src="assets/js/cliente_notificaciones.js"></script>
</body>
</html>

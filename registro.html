<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta — Ambrosía</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

  <header class="header-ambrosia py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="marca-ambrosia text-decoration-none">Ambrosía</a>
      <nav class="nav-ambrosia d-none d-lg-flex">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link" href="catalogo.html">Catálogo</a>
      </nav>
      <a href="login.html" class="btn-ambrosia-outline btn-sm">Iniciar sesión</a>
    </div>
  </header>

  <section class="seccion-auth seccion-auth--cliente">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

          <div class="text-center mb-4">
            <div class="icono-auth icono-auth--rosa"><i class="bi bi-stars"></i></div>
            <span class="eyebrow">Únete a Ambrosía</span>
            <h1 class="fuente-display mt-1">Crea tu cuenta</h1>
          </div>

          <form id="form-registro" class="formulario-ambrosia" novalidate>
            <div id="mensaje-error" class="mensaje-formulario mensaje-formulario--error"></div>
            <div id="mensaje-exito" class="mensaje-formulario mensaje-formulario--exito"></div>

            <div class="mb-3">
              <label for="nombre">Nombre completo</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="nombre" required autocomplete="name">
              </div>
            </div>

            <div class="mb-3">
              <label for="correo">Correo electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="correo" required autocomplete="email">
              </div>
            </div>

            <div class="mb-3">
              <label for="telefono">Teléfono <span class="fw-normal text-muted">(opcional)</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                <input type="tel" class="form-control" id="telefono" autocomplete="tel">
              </div>
            </div>

            <div class="mb-3">
              <label for="contrasena">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="contrasena" required minlength="6" autocomplete="new-password">
              </div>
              <div class="form-text">Mínimo 6 caracteres.</div>
            </div>

            <div class="mb-4">
              <label for="direccion">Dirección de entrega <span class="fw-normal text-muted">(opcional)</span></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                <input type="text" class="form-control" id="direccion" autocomplete="street-address">
              </div>
            </div>

            <button type="submit" class="btn-ambrosia w-100" id="boton-registro">Crear mi cuenta</button>

            <p class="text-center small mt-4 mb-0">
              ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </p>
          </form>

        </div>
      </div>
    </div>
  </section>

  <footer class="footer-ambrosia py-4">
    <div class="container text-center">
      <p class="small mb-0" style="opacity: 0.6;">&copy; 2026 Ambrosía. Sistema Bellatrix.</p>
    </div>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/registro.js"></script>
</body>
</html>

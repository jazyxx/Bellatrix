<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil — Ambrosía</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <div class="db-welcome-banner">
    <div class="db-welcome-banner__icono"><i class="bi bi-person-circle"></i></div>
    <div>
      <h1 class="fuente-display">Mi Perfil</h1>
      <p>Administra tu información personal y revisa tus notificaciones recientes.</p>
    </div>
  </div>

  <div class="row">
    <!-- Columna Izquierda: Perfil (Ahora ocupa la mitad de la pantalla) -->
    <div class="col-lg-6">
      <div class="db-card db-card--rosa mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <div class="d-flex align-items-center gap-2">
            <div class="db-avatar"><i class="bi bi-person-fill"></i></div>
            <h3 class="h5 mb-0 fuente-display">Mis Datos</h3>
          </div>
          <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modalEditarPerfil" title="Editar Perfil">
            <i class="bi bi-pencil-square"></i> Editar
          </button>
        </div>
        <hr class="my-2">
        
        <div class="mb-3">
          <label class="small text-muted d-block">Nombre completo</label>
          <strong id="perfil-nombre">-</strong>
        </div>
        <div class="mb-3">
          <label class="small text-muted d-block">Correo electrónico</label>
          <strong id="perfil-correo">-</strong>
        </div>
        <div class="mb-3">
          <label class="small text-muted d-block">Teléfono</label>
          <strong id="perfil-telefono">-</strong>
        </div>
        <div class="mb-3">
          <label class="small text-muted d-block">Rol de Usuario</label>
          <span class="badge-pastel badge-pastel-primary">Cliente Registrado</span>
        </div>

        <div class="mt-3 pt-2 border-top text-center">
          <a href="recuperar.html" class="small text-decoration-none text-muted">
            <i class="bi bi-key-fill"></i> ¿Deseas cambiar tu contraseña?
          </a>
        </div>
      </div>
    </div>

    <!-- Columna Derecha: Notificaciones -->
    <div class="col-lg-6">
      <div class="db-card db-card--warning">
        <div class="d-flex align-items-center gap-2 mb-3">
          <span class="db-card-icono db-card-icono--warning"><i class="bi bi-bell-fill"></i></span>
          <h3 class="h5 mb-0 fuente-display">Notificaciones Recientes</h3>
        </div>
        <hr class="my-2">
        <div id="lista-notificaciones" style="max-height: 400px; overflow-y: auto;">
          <p class="text-muted small text-center my-4">Cargando notificaciones…</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Editar Perfil (Mismo de cliente_dashboard.html) -->
  <div class="modal fade" id="modalEditarPerfil" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fuente-display">Editar Mis Datos</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form id="form-editar-perfil">
          <div class="modal-body">
            <div class="mb-3">
              <label for="input-perfil-nombre" class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="input-perfil-nombre" required>
            </div>
            <div class="mb-3">
              <label for="input-perfil-telefono" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="input-perfil-telefono" placeholder="Ej. 3001234567">
            </div>
            <div class="mb-3">
              <label for="input-perfil-correo" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control bg-light" id="input-perfil-correo" readonly disabled>
              <div class="form-text">El correo no se puede modificar porque es tu usuario de acceso.</div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard_components.js"></script>
  <script src="assets/js/cliente_dashboard.js"></script>
</body>
</html>

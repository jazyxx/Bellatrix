<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil — Ambrosía</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <div class="db-welcome-banner">
    <div class="db-welcome-banner__icono"><i class="bi bi-person-circle"></i></div>
    <div>
      <h1 class="fuente-display">Mi Perfil</h1>
      <p>Administra tu información personal y la dirección de entrega de tus pedidos.</p>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="db-card db-card--rosa mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <div class="d-flex align-items-center gap-2">
            <div class="db-avatar"><i class="bi bi-person-fill"></i></div>
            <h3 class="h5 mb-0 fuente-display">Mis Datos</h3>
          </div>
          <button class="btn btn-db-outline btn-sm" data-bs-toggle="modal" data-bs-target="#modalEditarPerfil" title="Editar Perfil">
            <i class="bi bi-pencil-square"></i> Editar
          </button>
        </div>
        <hr class="my-2">

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="small text-muted d-block">Nombre completo</label>
            <strong id="perfil-nombre">-</strong>
          </div>
          <div class="col-md-6 mb-3">
            <label class="small text-muted d-block">Correo electrónico</label>
            <strong id="perfil-correo">-</strong>
          </div>
          <div class="col-md-6 mb-3">
            <label class="small text-muted d-block">Teléfono</label>
            <strong id="perfil-telefono">-</strong>
          </div>
          <div class="col-md-6 mb-3">
            <label class="small text-muted d-block">Rol de Usuario</label>
            <div><span class="badge-pastel badge-pastel-primary">Cliente Registrado</span></div>
          </div>
          <div class="col-12 mb-3">
            <label class="small text-muted d-block">Dirección de entrega</label>
            <strong id="perfil-direccion">-</strong>
          </div>
        </div>

        <div class="mt-3 pt-2 border-top text-center">
          <a href="recuperar.html" class="small text-decoration-none text-muted">
            <i class="bi bi-key-fill"></i> ¿Deseas cambiar tu contraseña?
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Editar Perfil (Mismo de cliente_dashboard.html) -->
  <div class="modal fade" id="modalEditarPerfil" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content db-modal-content">
        <div class="modal-header db-modal-header">
          <div class="d-flex align-items-center gap-2">
            <div class="db-modal-icono"><i class="bi bi-person-fill-gear"></i></div>
            <h5 class="modal-title fuente-display mb-0">Editar Mis Datos</h5>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form id="form-editar-perfil">
          <div class="modal-body db-modal-body">
            <div class="mb-3">
              <label for="input-perfil-nombre" class="form-label small text-muted">Nombre completo</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control form-db" id="input-perfil-nombre" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="input-perfil-telefono" class="form-label small text-muted">Teléfono</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                <input type="tel" class="form-control form-db" id="input-perfil-telefono" placeholder="Ej. 3001234567">
              </div>
            </div>
            <div class="mb-3">
              <label for="input-perfil-direccion" class="form-label small text-muted">Dirección de entrega</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                <textarea class="form-control form-db" id="input-perfil-direccion" rows="2" placeholder="Dirección para tus pedidos a domicilio"></textarea>
              </div>
            </div>
            <div class="mb-1">
              <label for="input-perfil-correo" class="form-label small text-muted">Correo electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="email" class="form-control form-db" id="input-perfil-correo" readonly disabled style="background: var(--db-bg-light);">
              </div>
              <div class="form-text">El correo no se puede modificar porque es tu usuario de acceso.</div>
            </div>
          </div>
          <div class="modal-footer db-modal-footer">
            <button type="button" class="btn btn-db-outline btn-sm" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-db-primary btn-sm"><i class="bi bi-check-circle-fill me-1"></i>Guardar Cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard_components.js"></script>
  <script src="assets/js/cliente_dashboard.js"></script>
</body>
</html>

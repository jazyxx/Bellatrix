<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi carrito — Ambrosía</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>

  <header class="header-ambrosia py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="marca-ambrosia text-decoration-none">Ambrosía</a>
      <nav class="nav-ambrosia d-none d-lg-flex">
        <a class="nav-link" href="index.html">Inicio</a>
        <a class="nav-link" href="catalogo.html">Catálogo</a>
      </nav>
      <div class="d-flex align-items-center">
        <a href="carrito.html" class="icono-accion me-3 text-decoration-none activo" aria-label="Ver carrito">
          <i class="bi bi-basket3-fill"></i>
          <span id="contador-carrito" class="contador-carrito" style="display:none;">0</span>
        </a>
        <div id="zona-cuenta" class="d-flex align-items-center"></div>
      </div>
    </div>
  </header>

  <section class="seccion-carrito">
    <div class="container">
      <span class="eyebrow">Revisa antes de confirmar</span>
      <h1 class="fuente-display mt-1 mb-4">Mi carrito</h1>

      <!-- Se muestra solo si el carrito llega vacío -->
      <div id="carrito-vacio" class="estado-vacio" style="display:none;">
        <div class="estado-vacio__icono"><i class="bi bi-basket3"></i></div>
        <p class="mb-3">Tu carrito está vacío por ahora.</p>
        <a href="catalogo.html" class="btn-ambrosia">Ir al catálogo</a>
      </div>

      <div id="carrito-contenido" class="row g-4" style="display:none;">
        <div class="col-lg-8">
          <div id="lista-items" class="d-flex flex-column gap-3">
            <!-- carrito.js inserta aquí cada fila -->
          </div>
        </div>

        <div class="col-lg-4">
          <div class="resumen-carrito">
            <h3 class="h5 mb-3" style="color: var(--crema); font-family: var(--fuente-display);">Resumen</h3>
            <div class="d-flex justify-content-between mb-2">
              <span>Subtotal</span>
              <strong id="texto-subtotal">$ 0</strong>
            </div>
            <p class="small mb-4" style="opacity: 0.75;">El envío se coordina al confirmar tu pedido.</p>

            <label for="direccion-entrega" class="d-block mb-1 small fw-bold">Dirección de entrega</label>
            <input type="text" id="direccion-entrega" class="form-control mb-3" placeholder="Calle, número, barrio, ciudad">

            <div id="mensaje-pedido" class="mensaje-formulario mensaje-formulario--error" style="display:none;"></div>

            <button id="boton-confirmar-pedido" class="btn-ambrosia">Confirmar pedido</button>
          </div>
        </div>
      </div>

      <div id="carrito-cargando" class="text-center text-muted py-5">Cargando tu carrito…</div>
    </div>
  </section>

  <footer class="footer-ambrosia py-4">
    <div class="container text-center">
      <p class="small mb-0" style="opacity: 0.6;">&copy; 2026 Ambrosía. Sistema Bellatrix.</p>
    </div>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/componentes.js"></script>
  <script src="assets/js/carrito.js"></script>
</body>
</html>
